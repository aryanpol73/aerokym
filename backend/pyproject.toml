[project]
name = "aerokym"
version = "0.0.1"
description = "Open turbulence map inferred from public ADS-B data"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "numpy>=1.26", "psycopg[binary]>=3.2", "h3>=4.1", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aerokym*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
